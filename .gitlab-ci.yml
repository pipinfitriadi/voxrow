# Python gitlab ci example
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml
# global before_script not executed when job has an own before_script
# https://gitlab.com/gitlab-org/gitlab-runner/-/issues/2301

stages:
  - Test
  - Release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  image: python:3.9.15-slim
  cache:
    paths:
      - .cache/pip
      - venv/
  before_script:
    - python -m venv venv
    - . venv/bin/activate

Lint:
  stage: Test
  image: pipelinecomponents/flake8
  cache: []
  only:
    changes:
      - "**/*.py"
  except:
    - tags
  before_script: []
  script:
    - flake8 --exclude venv/

PyPI:
  stage: Release
  only:
    refs:
      - master
    changes:
      - src/**/*
  except:
    - tags
  before_script:
    - !reference [ default, before_script ] 
    - pip install build twine
  script:
    - python -m build
    - twine upload dist/*
  artifacts:
    paths:
      - dist/*
