[build-system]
requires = ['setuptools>=61.0', 'setuptools-git-versioning<2']
build-backend = 'setuptools.build_meta'

[project]
name = 'voxrow'
description = "VOXROW's library"
readme = 'README.md'
requires-python = '>=3.12'
license = {text = 'Proprietary'}
keywords = [
    'voxrow',
    'library',
]
authors = [{name = 'Pipin Fitriadi', email = 'pipinfitriadi@gmail.com'}]
maintainers = [{name = 'Pipin Fitriadi', email = 'pipinfitriadi@gmail.com'}]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Developers',
    'Intended Audience :: Information Technology',
    'License :: Other/Proprietary License',
    'Natural Language :: English',
    'Natural Language :: Indonesian',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.12',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Utilities',
]
dependencies = [
    'pandas',
    'pydantic',
    'pydantic-settings',
    'rich',
]
dynamic = ['version']

[project.optional-dependencies]
cli = [
    'typer',
]
database = [
    'google-cloud-bigquery',
    'sqlmodel',
    'psycopg2-binary',
]
http = [
    'httpx',
]
not_supported_by_vercel = [
    'duckdb',
]
storage = [
    'boto3',
    'google-cloud-storage',
]

[dependency-groups]
code-coverage = [
    'coverage',
    'pytest',
    'pytest-asyncio',
    'toml',
]
code-quality = [
    'ruff',
]
notebook = [
    'ipykernel',
    'duckdb',
    'magic_duckdb',
]
dev = [
    'build',
    'git-filter-repo',
    'httpx[cli]',
    {include-group = 'code-coverage'},
    {include-group = 'code-quality'},
    {include-group = 'notebook'},
]

[project.urls]
Repository = 'https://github.com/pipinfitriadi/voxrow'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'C408',
    'COM812',
    'D100',
    'D101',
    'D102',
    'D103',
    'D104',
    'D105',
    'D107',
    'D203',
    'D212',
    'EXE001',
    'TID252',
]

[tool.ruff.lint.per-file-ignores]
'tests/*.py' = ['S101']

[tool.setuptools.packages.find]
include = ['voxrow.core.*']

[tool.setuptools-git-versioning]
enabled = true
template = '{tag}'
dev_template = '{tag}'
dirty_template = '{tag}'
tag_filter = '^\d+\.\d+\.\d+(-[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*)?(\+[a-zA-Z0-9]+(\.[a-zA-Z0-9]+)*)?$'
